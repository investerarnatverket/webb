# Adaptern anges uttryckligen. Netlify lade inte till den av sig själv vid
# första bygget och publicerade då repots rot, alltså källkoden, i stället för sajten.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
  # Utkastet för gruppen: exempel-event, inga mejl, ingen inloggning.
  # Ta bort raden när Supabase och Resend är uppsatta.
  DEMO = "1"
